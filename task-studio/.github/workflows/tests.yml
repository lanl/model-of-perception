name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv python install 3.13.12
      - run: uv sync --locked --no-dev --extra datasets --python 3.13.12
      - run: uv run --locked --extra datasets python -m unittest discover -s tests -v
      - run: node tests/test_visualization.mjs
